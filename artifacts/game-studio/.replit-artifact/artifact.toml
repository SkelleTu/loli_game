kind = "web"
previewPath = "/"
title = "Game Studio 3D"
version = "1.0.0"
id = "artifacts/game-studio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20100

[services.development]
run = "pnpm --filter @workspace/game-studio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/game-studio", "run", "build" ]
serve = "static"
publicDir = "artifacts/game-studio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20100"
BASE_PATH = "/"
